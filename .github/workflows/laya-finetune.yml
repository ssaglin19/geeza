name: Laya CI smoke test

# Runs a tiny smoke test on push to verify the pipeline (corpus generation,
# model loading, training loop) works end-to-end. Real fine-tuning happens
# locally or on a larger runner — GitHub's free CPU runners OOM on the 421M
# model with more than ~100 examples.

on:
  push:
    paths:
      - "laya/**"
      - ".github/workflows/laya-finetune.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install laya scikit-learn

      - name: Generate small corpus
        run: |
          python laya/datasets/generate_scam_corpus.py \
            --out laya/datasets/smoke_corpus.jsonl \
            --n-scam 50 --n-legit 50 --seed 42

      - name: Smoke-test training (100 examples, 1 epoch)
        run: |
          python laya/train/finetune_local.py \
            --corpus laya/datasets/smoke_corpus.jsonl \
            --epochs 1 --n 100 --batch-size 8 \
            --save laya/train/smoke_head.pt

      - name: Verify output
        run: |
          test -f laya/train/smoke_head.pt && echo "smoke test passed"
